stages:
  - validate

.terraform-image: &terraform-image
  image: hashicorp/terraform:1.9
  before_script:
    - terraform -version || true
    - which tofu >/dev/null 2>&1 && tofu -version || true

fmt-validate:
  stage: validate
  <<: *terraform-image
  script:
    - |
      set -e
      TF=terraform
      if command -v tofu >/dev/null 2>&1; then TF=tofu; fi
      if ! command -v "$TF" >/dev/null 2>&1; then
        echo "Neither terraform nor tofu available — skipping fmt/validate."
        exit 0
      fi
      for dir in examples/spacelift examples/env0 examples/scalr; do
        echo "==> $dir"
        (cd "$dir" && $TF fmt -check -recursive)
        (cd "$dir" && $TF init -backend=false -input=false)
        (cd "$dir" && $TF validate)
      done
  rules:
    - if: $CI_PIPELINE_SOURCE
      when: always
